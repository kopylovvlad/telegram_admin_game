<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Симулятор админа мем-паблика</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="desktop">
    <header class="topbar">
      <h1>Симулятор админа мем-паблика</h1>
      <div class="day-info">
        <span id="dayLabel">День 1</span>
        <span id="actionsLabel">Действий: 5</span>
        <span id="postsLabel">Постов: 0/5</span>
      </div>
    </header>

    <section class="stats-strip">
      <div class="stat-card">
        <p>Подпищики</p>
        <strong id="subsValue">10</strong>
      </div>
      <div class="stat-card">
        <p>Менталка</p>
        <strong id="mentalValue">100%</strong>
      </div>
      <div class="stat-card">
        <p>Постов за день</p>
        <strong id="dailyPostsValue">0/5</strong>
      </div>
    </section>

    <main class="windows">
      <section id="tele" class="window">
        <h2>Телега</h2>
        <p class="muted">Каждый день у тебя 5 действий = 5 постов. После пятого поста день заканчивается автоматически.</p>
        <div class="actions-row">
          <button id="postOwnBtn">Запостить свой кринж</button>
          <button id="repostBtn">Честный репост</button>
          <button id="stealBtn">Украсть мем</button>
        </div>
        <h3>Чаты и реакции</h3>
        <div id="chatFeed" class="feed"></div>
      </section>
    </main>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <h2 id="endingTitle">Итог</h2>
      <p id="endingText"></p>
      <button id="restartBtn">Играть заново</button>
    </div>
  </div>

  <script src="./game.js"></script>
</body>
</html>
